# Lint config for the Glitch Guesser.
#
# line-length is 100 rather than the default 88: several of the FIX: comments
# explain a bug in one sentence and read worse wrapped.
line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B"]
# D203/D213 contradict D211/D212. This project uses the Google convention:
# no blank line before a class docstring, summary on the first line.
ignore = ["D203", "D213"]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
# The three starter tests document themselves with inline comments, and they
# are kept verbatim so the diff against the starter stays honest.
"tests/*" = ["D103"]
